<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>壁挂式空调</title>
<style>
  :root{
    --bg1:#eaf3fb; --bg2:#f7fbff; --card:#ffffff;
    --txt:#2c3240; --dim:#9aa5b5; --line:#e3ebf5;
    --accent:#2f7fe0; --accent-soft:#e8f2ff; --radius:18px;
    --shadow:0 6px 22px rgba(58,110,170,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2) 42%,#ffffff 100%);
    color:var(--txt);font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;justify-content:center;
  }
  .phone{width:100%;max-width:430px;padding:18px 16px 110px;position:relative}
  header{display:flex;align-items:center;justify-content:center;position:relative;height:34px;margin-bottom:8px}
  header h1{font-size:17px;font-weight:600;letter-spacing:.5px}
  .more{position:absolute;right:0;background:none;border:none;font-size:18px;color:var(--dim);cursor:pointer;padding:6px}
  .device{display:flex;justify-content:center;margin:2px 0 18px}
  .device img{width:92%;max-width:330px;height:120px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(80,120,170,.16))}

  .temps{display:flex;justify-content:center;gap:56px;margin-bottom:18px;text-align:center}
  .temps .v{font-size:19px;font-weight:500;letter-spacing:.2px}
  .temps .k{font-size:12px;color:var(--dim);margin-top:4px}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(229,238,248,.9)}

  .hero{padding:22px 22px 18px;margin-bottom:14px}
  .temp{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .temp .val{font-size:40px;font-weight:400;letter-spacing:-.5px;color:var(--txt)}
  .temp .val span{font-size:16px;color:var(--dim)}
  .temp button{
    width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;
    color:#b9c3d1;font-size:20px;cursor:pointer;transition:.18s;line-height:1
  }
  .temp button:hover{color:var(--accent);border-color:#c9dcf4}
  .slide{position:relative;height:46px;display:flex;align-items:flex-start;padding-top:6px}
  .slide .bub{
    position:absolute;top:29px;left:0;transform:translateX(-50%);font-size:12px;line-height:1.5;
    padding:1px 8px;border-radius:9px;background:#fff;border:1px solid #dbe8f7;color:var(--accent);
    white-space:nowrap;pointer-events:none;transition:left .05s linear
  }
  input[type=range]{
    -webkit-appearance:none;width:100%;height:6px;border-radius:6px;outline:none;
    background:linear-gradient(90deg,#cfe3fa,#eef4fb);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;
    border:1px solid #dce6f3;box-shadow:0 2px 8px rgba(70,120,180,.22);cursor:pointer;
  }

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .stat{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .stat .label{font-size:12px;color:var(--dim)}
  .stat .name{font-size:17px;font-weight:500;margin-top:6px}
  .stat svg{width:26px;height:26px;stroke:#c4d0e0;fill:none;stroke-width:1.6}

  .funcs{padding:18px 16px 14px}
  .func-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .func-head h2{font-size:15px;font-weight:600}
  .func-head .tools{display:flex;gap:8px}
  .func-head .tools button{
    border:1px solid var(--line);background:#fbfdff;color:#93a0b2;font-size:11px;
    padding:5px 10px;border-radius:20px;cursor:pointer
  }
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px}
  .fn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;
      padding:6px 2px;cursor:pointer;color:var(--dim);font-size:11px;position:relative}
  .fn .ico{width:44px;height:44px;border-radius:50%;background:#f7fafd;border:1px solid #eef4fa;
           display:flex;align-items:center;justify-content:center;transition:.18s}
  .fn svg{width:21px;height:21px;stroke:#b8c4d4;fill:none;stroke-width:1.5;transition:.18s}
  .fn span{color:#9aa5b5}
  .fn.on .ico{background:var(--accent-soft);border-color:#cfe2f8}
  .fn.on svg{stroke:var(--accent)}
  .fn.on span{color:var(--accent)}
  .fn.na{opacity:.42}

  footer{
    position:fixed;left:0;right:0;bottom:0;padding:14px 16px 22px;
    background:linear-gradient(180deg,rgba(255,255,255,.72),#ffffff 40%);
    backdrop-filter:blur(10px);display:flex;justify-content:center;gap:92px;
    border-top:1px solid rgba(230,238,247,.8)
  }
  .big{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:7px;
       font-size:12px;color:#8d99aa;cursor:pointer}
  .big .ring{width:52px;height:52px;border-radius:50%;background:#eef6fe;border:1px solid #dcebfb;
             display:flex;align-items:center;justify-content:center;transition:.2s}
  .big svg{width:26px;height:26px;stroke:#8fb8e8;fill:none;stroke-width:1.5}
  .big.on .ring{background:linear-gradient(150deg,#4a94ef,#2f7fe0);border-color:transparent;
                box-shadow:0 8px 20px rgba(47,127,224,.35)}
  .big.on svg{stroke:#fff}
  .big.on span{color:var(--accent)}

  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(28,38,52,.34);opacity:0;pointer-events:none;transition:.2s;z-index:20}
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;
         padding:18px 20px 28px;transform:translateY(102%);transition:.26s cubic-bezier(.3,.8,.4,1);z-index:21;
         max-width:430px;margin:0 auto}
  .sheet.show{transform:translateY(0)}
  .sheet h3{font-size:15px;font-weight:600;margin-bottom:14px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:12px;
       background:#f8fbff;border:1px solid #eef3f9;cursor:pointer;font-size:14px}
  .opt.active{border-color:#bcd8f7;background:var(--accent-soft);color:var(--accent)}
  .opt small{color:var(--dim);font-size:11px}
  .fanbox{display:flex;flex-direction:column;gap:16px}
  .fanbox .fanval{text-align:center;font-size:34px;font-weight:400}
  .fanbox .fanval span{font-size:14px;color:var(--dim);margin-left:2px}
  .fanquick{display:flex;gap:8px;flex-wrap:wrap}
  .fanquick button{flex:1 1 auto;padding:9px 10px;border-radius:10px;border:1px solid #eef3f9;
                   background:#f8fbff;color:#7d8ea3;font-size:12px;cursor:pointer}
  .fanok{width:100%;padding:13px;border-radius:12px;border:none;font-size:14px;color:#fff;cursor:pointer;
         background:linear-gradient(145deg,#4a94ef,#2f7fe0)}
  .toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(38,46,58,.9);color:#fff;
         font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:80%}
  .toast.show{opacity:1}
  /* 点击后就地转圈：图标淡出、在原位显示环形加载 */
  .fn .ico, .big .ring, .stat{position:relative}
  .fn.pending, .big.pending{pointer-events:none}
  .fn.pending .ico svg, .big.pending .ring svg, .stat.pending > svg{opacity:0;transition:opacity .15s}
  .fn.pending .ico::after, .big.pending .ring::after{
    content:'';position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;
    border:2px solid rgba(47,127,224,.25);border-top-color:var(--accent);border-radius:50%;
    animation:spin .7s linear infinite}
  .stat.pending::after{
    content:'';position:absolute;right:20px;top:50%;width:18px;height:18px;margin-top:-9px;
    border:2px solid rgba(47,127,224,.25);border-top-color:var(--accent);border-radius:50%;
    animation:spin .7s linear infinite}
  .temp button.pending{color:transparent;position:relative}
  .temp button.pending::after{
    content:'';position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
    border:2px solid rgba(47,127,224,.25);border-top-color:var(--accent);border-radius:50%;
    animation:spin .7s linear infinite}
  .slide.pending{opacity:.55;pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 首次连接 / 密钥失效 的设置弹窗 ---------- */
  .setup-mask{position:fixed;inset:0;background:rgba(24,28,36,.45);display:none;
    align-items:center;justify-content:center;z-index:20;padding:16px}
  .setup-mask.show{display:flex}
  .setup-card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:20px;
    box-shadow:0 12px 40px rgba(0,0,0,.18);max-height:92vh;overflow:auto}
  .setup-card h2{margin:0 0 6px;font-size:17px}
  .setup-msg{margin:0 0 12px;font-size:12.5px;color:#7a8290;line-height:1.5}
  .setup-dev{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .sdev{border:1px solid #e6e9ee;border-radius:10px;padding:9px 11px;cursor:pointer;font-size:13px}
  .sdev b{display:block;font-weight:600}
  .sdev small{color:#8a92a0;font-size:11.5px}
  .sdev.active{border-color:var(--accent);background:rgba(47,127,224,.06)}
  .sdev.empty{border-style:dashed;color:#8a92a0;text-align:center;cursor:default}
  .setup-card label{display:block;font-size:12px;color:#5c6472;margin-bottom:10px}
  .setup-card input[type=password],.setup-card input[type=text]{width:100%;margin-top:4px;padding:9px 10px;
    border:1px solid #e0e4ea;border-radius:9px;font:12.5px/1.4 ui-monospace,monospace;box-sizing:border-box}
  .setup-card input.bad{border-color:#e05a5a;background:#fff7f7}
  .setup-actions{display:flex;gap:8px;margin-top:4px}
  .setup-actions button{flex:1;padding:10px;border-radius:10px;border:1px solid #e0e4ea;background:#fff;
    font-size:13px;cursor:pointer}
  .setup-actions button#sSave{background:var(--accent);border-color:var(--accent);color:#fff}
  .setup-actions button:disabled{opacity:.6;cursor:default}
  .setup-err{margin-top:9px;font-size:12px;color:#d04545;min-height:16px;line-height:1.5}
</style>
</head>
<body>
<div class="phone">
  <header>
    <h1>壁挂式空调</h1>
    <button class="more" id="more">⋯</button>
  </header>

  <div class="device">
    <img alt="空调" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=white%20wall-mounted%20air%20conditioner%20indoor%20unit%2C%20front%20side%20view%2C%20clean%20light%20blue%20background%2C%20product%20photography%2C%20soft%20studio%20lighting%2C%20no%20text%2C%20minimal&image_size=landscape_4_3">
  </div>

  <div class="temps">
    <div><div class="v" id="outdoor">--℃</div><div class="k">室外温度</div></div>
    <div><div class="v" id="indoor">--℃</div><div class="k">室内温度</div></div>
  </div>

  <section class="card hero">
    <div class="temp">
      <button id="minus">−</button>
      <div class="val"><span id="target">--</span><span>℃</span></div>
      <button id="plus">+</button>
    </div>
    <div class="slide"><div class="bub" id="bub">23℃</div><input type="range" id="slider" min="17" max="30" step="1" value="26"></div>
  </section>

  <div class="row2">
    <section class="card stat" id="modeCard">
      <div>
        <div class="label">模式</div>
        <div class="name" id="modeName">—</div>
      </div>
      <svg viewBox="0 0 24 24"><path d="M12 3v18M5 6.5l14 11M19 6.5L5 17.5"/><circle cx="12" cy="12" r="1.6"/></svg>
    </section>
    <section class="card stat" id="fanCard">
      <div>
        <div class="label">风速</div>
        <div class="name" id="fanName">—</div>
      </div>
      <svg viewBox="0 0 24 24"><path d="M12 12c0-3 3.2-3.4 3.2-3.4 2.8 0 3.6 3.4 1.2 4.6-1 .5-2.4.3-4.4-1.2"/><path d="M12 12c1.5-2 5-1 4.6 1.6"/><path d="M12 12c-2.6-1.2-3.2 1.6-2 3.2"/><circle cx="12" cy="12" r="1.4"/></svg>
    </section>
  </div>

  <section class="card funcs">
    <div class="func-head">
      <h2>常用功能</h2>
      <div class="tools">
        <button id="sortBtn">排序</button>
        <button id="helpBtn">功能说明 ›</button>
      </div>
    </div>
    <div class="grid" id="grid">
      <button class="fn" data-fn="swing_v">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 4v16"/><path d="M8 8l4-4 4 4"/><path d="M8 16l4 4 4-4"/></svg></div>
        <span>上下摆风</span>
      </button>
      <button class="fn" data-fn="swing_h">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/></svg></div>
        <span>左右摆风</span>
      </button>
      <button class="fn" data-fn="eco">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 4c4 2 6 5 6 8a6 6 0 0 1-12 0c0-3 2-6 6-8z"/><path d="M12 12v6"/></svg></div>
        <span>ECO</span>
      </button>
      <button class="fn" data-fn="turbo">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M13 3L6 13h5l-1 8 7-10h-5z"/></svg></div>
        <span>强劲</span>
      </button>
      <button class="fn" data-fn="freeze">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M5 7l14 10"/><path d="M19 7L5 17"/></svg></div>
        <span>防冻</span>
      </button>
      <button class="fn" data-fn="purifier">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14z"/><path d="M5 19l8-8"/></svg></div>
        <span>净化</span>
      </button>
      <button class="fn" data-fn="display">
        <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M9 21h6"/><path d="M12 17v4"/></svg></div>
        <span>屏显</span>
      </button>
      <button class="fn" data-fn="filter">
        <div class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M4 15h16M9 4v16M15 4v16"/></svg></div>
        <span>滤网</span>
      </button>
    </div>
  </section>
</div>

<footer>
  <button class="big" id="powerBtn"><div class="ring"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.5 6.8a8 8 0 1 0 11 0"/></svg></div><span id="powerLabel">开机</span></button>
</footer>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><h3 id="sheetTitle">选择</h3><div class="opts" id="opts"></div></div>
<div class="toast" id="toast"></div>

<div class="setup-mask" id="setupMask">
  <div class="setup-card">
    <h2 id="setupTitle">首次连接</h2>
    <p class="setup-msg" id="setupMsg"></p>
    <div class="setup-dev" id="setupDev"></div>
    <label>token（128 位十六进制）
      <input id="sToken" type="password" autocomplete="off" spellcheck="false" placeholder="从美居 App 获取的 token"></label>
    <label>key（64 位十六进制）
      <input id="sKey" type="password" autocomplete="off" spellcheck="false" placeholder="从美居 App 获取的 key"></label>
    <div class="setup-actions">
      <button id="sDiscover">重新发现</button>
      <button id="sSave">保存并连接</button>
    </div>
    <div class="setup-err" id="sErr"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = null, busy = false;

const MODE_NAMES = {cool:'制冷', heat:'制热', dry:'除湿', fan:'送风', auto:'自动'};
const MODE_OPTS = [['cool','制冷'],['heat','制热'],['dry','除湿'],['fan','送风'],['auto','自动']];
const FAN_OPTS = [['silent','静音'],['low','低'],['medium','中'],['high','高'],['max','强劲'],['auto','自动']];
const HELP = {
  '上下摆风':'导风板上下往复摆动。',
  '左右摆风':'导风板左右往复摆动。',
  'ECO':'节能模式，降低压缩机与风机功耗。',
  '强劲':'压缩机与风机全功率运行，快速制冷/制热。',
  '防冻':'低温环境下保护管路，防止结冰。',
  '净化':'开启机身净化模块，吸附空气中的悬浮颗粒。',
  '屏显':'控制空调面板显示屏的亮灭。',
  '滤网':'读取滤网脏堵告警，亮起表示需要清洗。'
};

function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1800);
}
/* 点击的控件原地转圈，请求返回后由 render 呈现执行结果 */
async function act(payload, el){
  if(busy) return toast('上一条指令还在执行，请稍候');
  busy = true;
  el?.classList.add('pending');
  try{
    const s = await api('/api/control', payload);
    render(s);
    if(s.applied === false){          // 设备没接受，界面上以回读值为准并提示
      toast('指令未生效：' + Object.keys(s.mismatch || {}).join('、'));
    }
  }
  catch(e){ toast('指令失败：' + e.message); }
  finally{ busy = false; el?.classList.remove('pending'); }
}

async function load(){
  try{
    render(await api('/api/status'));
    $('setupMask').classList.remove('show');
  }catch(e){
    if(e.status === 428){ return showSetup(e.data); }   // 需要 token/key
    toast('读取失败：' + e.message);
  }
}

/* ---------- 设置弹窗：首次连接或密钥失效时填 token/key ---------- */
let setupSel = null;

function setupErr(msg){
  $('sErr').textContent = msg || '';
}

function showSetup(d){
  d = d || {};
  $('setupTitle').textContent = d.reason === 'auth_failed' ? '密钥已失效' : '首次连接';
  $('setupMsg').textContent = d.message || '';
  setupErr('');
  setupSel = null;
  $('sToken').classList.remove('bad');
  $('sKey').classList.remove('bad');
  $('setupMask').classList.add('show');
  discoverDevices(d.device);
}

async function discoverDevices(fallback){
  $('setupDev').innerHTML = '<div class="sdev empty">正在发现局域网内的空调…</div>';
  let list = [];
  try{
    list = (await api('/api/setup/discover')).devices || [];
  }catch(e){
    list = [];
    setupErr('发现失败：' + e.message);
  }
  if(!list.length && fallback && fallback.ip) list = [fallback];
  if(!list.length){
    $('setupDev').innerHTML = '<div class="sdev empty">未发现设备，请确认空调已通电并接入同一 Wi-Fi</div>';
    setupSel = null;
    return;
  }
  $('setupDev').innerHTML = list.map((d, i) =>
    `<div class="sdev" data-i="${i}"><b>${d.name || '空调'}</b><small>${
      [d.model, d.ip, d.sn && ('SN ' + d.sn)].filter(Boolean).join(' · ')
    }</small></div>`).join('');
  const els = [...$('setupDev').querySelectorAll('.sdev')];
  els.forEach((el, i) => el.onclick = () => {
    els.forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    setupSel = list[i];
  });
  els[0].click();
}

async function saveSetup(){
  const token = $('sToken').value.trim();
  const key = $('sKey').value.trim();
  const okT = /^[0-9a-fA-F]{128}$/.test(token);
  const okK = /^[0-9a-fA-F]{64}$/.test(key);
  $('sToken').classList.toggle('bad', !okT);
  $('sKey').classList.toggle('bad', !okK);
  if(!setupSel) return setupErr('请先选择要连接的空调');
  if(!okT) return setupErr(`token 应为 128 位十六进制，当前 ${token.length} 位`);
  if(!okK) return setupErr(`key 应为 64 位十六进制，当前 ${key.length} 位`);

  const btn = $('sSave');
  btn.disabled = true; btn.textContent = '连接中…';
  setupErr('');
  try{
    const r = await api('/api/setup', Object.assign({}, setupSel, {token, key}));
    $('setupMask').classList.remove('show');
    render(r.state);
    toast('连接成功');
  }catch(e){
    setupErr(e.message);
  }finally{
    btn.disabled = false; btn.textContent = '保存并连接';
  }
}

/* 温度滑块的浮动标注：跟随滑块位置显示当前度数 */
function paintBubble(v){
  const min = 17, max = 30, thumb = 22;
  const pct = Math.min(1, Math.max(0, (v - min) / (max - min)));
  const bub = $('bub');
  bub.textContent = v + '℃';
  bub.style.left = `calc(${pct * 100}% - ${pct * thumb}px + ${thumb / 2}px)`;
}

function render(s){
  state = s;
  $('target').textContent = s.target == null ? '--' : Number(s.target).toFixed(1).replace('.0','');
  $('slider').value = s.target ?? 26;
  paintBubble(s.target ?? 26);
  $('indoor').textContent = s.indoor == null ? '--℃' : Number(s.indoor).toFixed(1) + '℃';
  $('outdoor').textContent = s.outdoor == null ? '--℃' : Number(s.outdoor).toFixed(1) + '℃';
  $('modeName').textContent = MODE_NAMES[s.mode] || s.mode;
  $('fanName').textContent = s.fan_pct == null ? (s.fan === 'auto' ? '自动' : s.fan)
                            : s.fan_pct + '%';
  $('powerBtn').classList.toggle('on', s.power);
  $('powerLabel').textContent = s.power ? '关机' : '开机';

  const flags = {swing_v:s.swing_v, swing_h:s.swing_h, eco:s.eco, turbo:s.turbo,
                 freeze:s.freeze, purifier:s.purifier, display:s.display};
  document.querySelectorAll('.fn').forEach(el => {
    const k = el.dataset.fn;
    if(k === 'filter'){ el.classList.toggle('on', !!s.filter_alert); return; }  // 亮起代表滤网需清洗
    el.classList.toggle('on', !!flags[k]);
  });
}

async function api(path, body){
  const r = await fetch(path, body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {});
  const data = await r.json().catch(() => ({}));
  if(!r.ok){
    const err = new Error(data.message || data.error || '请求失败');
    err.status = r.status; err.data = data;
    throw err;
  }
  return data;
}

function openSheet(){ $('mask').classList.add('show'); $('sheet').classList.add('show'); }

function sheet(title, options, current, onPick){
  $('sheetTitle').textContent = title;
  $('opts').innerHTML = '';
  options.forEach(([v, label]) => {
    const el = document.createElement('div');
    el.className = 'opt' + (v === current ? ' active' : '');
    el.innerHTML = `<span>${label}</span>` + (v === current ? '<small>当前</small>' : '');
    el.onclick = () => { closeSheet(); onPick(v); };
    $('opts').appendChild(el);
  });
  openSheet();
}

/* 风速：支持自定义风速时用 1-100% 滑杆，否则退回档位选择 */
function openFanSheet(){
  const s = state || {};
  if(!(s.caps && s.caps.custom_fan)){
    return sheet('选择风速', FAN_OPTS, s.fan, v => act({fan: v}, $('fanCard')));
  }
  const cur = s.fan_pct ?? 20;
  $('sheetTitle').textContent = '风速';
  $('opts').innerHTML = `
    <div class="fanbox">
      <div class="fanval"><b id="fv">${cur}</b><span>%</span></div>
      <input type="range" id="fanRange" min="1" max="100" step="1" value="${cur}">
      <div class="fanquick">${FAN_OPTS.map(([v,l]) => `<button data-fan="${v}">${l}</button>`).join('')}</div>
      <button class="fanok" id="fanOk">应用</button>
    </div>`;
  const range = $('fanRange');
  range.oninput = () => { $('fv').textContent = range.value; };
  $('opts').querySelectorAll('[data-fan]').forEach(b => {
    b.onclick = () => { closeSheet(); act({fan: b.dataset.fan}, $('fanCard')); };
  });
  $('fanOk').onclick = () => { closeSheet(); act({fan_pct: Number(range.value)}, $('fanCard')); };
  openSheet();
}
function closeSheet(){ $('mask').classList.remove('show'); $('sheet').classList.remove('show'); }
$('mask').onclick = closeSheet;

$('powerBtn').onclick = () => act({power: !state?.power}, $('powerBtn'));
$('minus').onclick = () => act({temp: Math.max(17, Math.round((state?.target ?? 26) - 1))}, $('minus'));
$('plus').onclick = () => act({temp: Math.min(30, Math.round((state?.target ?? 26) + 1))}, $('plus'));
$('slider').oninput = e => {
  // 拖动过程中只更新显示，不打扰设备
  const v = Number(e.target.value);
  $('target').textContent = v;
  paintBubble(v);
};
$('slider').onchange = e => act({temp: Number(e.target.value)}, $('slider').parentElement);

$('modeCard').onclick = () => sheet('选择模式', MODE_OPTS, state?.mode, v => act({mode: v}, $('modeCard')));
$('fanCard').onclick = openFanSheet;

document.querySelectorAll('.fn').forEach(el => {
  el.onclick = () => {
    const k = el.dataset.fn;
    if(k === 'filter') return toast(state?.filter_alert ? '滤网需要清洗' : '滤网状态正常');
    act({[k]: !state?.[k]}, el);
  };
});

$('sortBtn').onclick = () => toast('暂时只展示常用功能，排序未实现');
$('sSave').onclick = saveSetup;
$('sDiscover').onclick = () => discoverDevices(null);
$('helpBtn').onclick = () => {
  const opts = Object.entries(HELP).map(([k,v]) => [k, `<b>${k}</b><br><small style="color:#9aa5b5">${v}</small>`]);
  sheet('功能说明', opts, null, () => {});
};
$('more').onclick = () => toast(`${state?.model || '美的空调'} · ${state?.ip || ''}:6444`);

load();
</script>
